function buildLU(sq,fm,xi){

 const pick=(arr,m)=>{const t=arr.reduce((s,x)=>s+wp(x,m),0);let r=Math.random()*t;for(const x of arr){r-=wp(x,m);if(r<=0)return x}return arr[arr.length-1]};
 const p=pick(L,{FWD:3,MID:1.4,DEF:.5,GK:.02}),others=L.filter(x=>x.id!==p.id);
 return{p,a:others.length&&Math.random()<.7?pick(others,{FWD:1.6,MID:2,DEF:.8,GK:.05}):null};
}
function genEv(h,a,hg,ag){
 const ev=[];
 for(let i=0;i<hg+ag;i++){const s=i<hg?0:1,g=pickScorer(s?a:h);ev.push({s,p:g.p.id,pn:g.p.name,a:g.a?g.a.id:'',an:g.a?g.a.name:'',m:1+Math.floor(Math.random()*90)})}
 return ev.sort((x,y)=>x.m-y.m);
}
function vTable(){
 const seg=`<div style="display:flex;gap:6px;margin-bottom:12px"><button class="btn${tTab==='table'?' pr':''}" onclick="tTab='table';render()">Таблица</button><button class="btn${tTab==='stats'?' pr':''}" onclick="tTab='stats';render()">Статистика</button></div>`;
 return seg+(tTab==='stats'?vStats():vTable0());
}
function vStats(){
 const all=[];matches.filter(m=>m.done).forEach(m=>all.push({...m,lg:1}));cupm.filter(m=>m.done&&m.a).forEach(m=>all.push(m));
 if(!all.length)return '<div class="card mu">Статистика появится после первых сыгранных матчей.</div>';
 const G={},A={},CS={};
 all.forEach(m=>{(m.ev||[]).forEach(e=>{const c=e.s?m.a:m.h;
   if(e.p){const g=G[e.p]=G[e.p]||{n:e.pn,c,v:0};g.v++}
   if(e.a){const a=A[e.a]=A[e.a]||{n:e.an,c,v:0};a.v++}});
  if(m.ag===0)CS[m.h]=(CS[m.h]||0)+1;if(m.hg===0)CS[m.a]=(CS[m.a]||0)+1});
 const top=o=>Object.values(o).sort((x,y)=>y.v-x.v).slice(0,10);
 const list=L=>L.map((x,i)=>`<div class="row"><b style="width:22px;color:var(--mu)">${i+1}</b>${clogo(x.c)}<div class="g"><b>${esc(x.n)}</b><div class="mu">${esc(cname(x.c))}</div></div><b style="font-size:18px">${x.v}</b></div>`).join('')||'<div class="mu">Пока нет данных</div>';
 const goals=all.reduce((s,m)=>s+m.hg+m.ag,0);
 const lr=Math.max(0,...all.filter(m=>m.lg).map(m=>m.round));
 const P={};all.filter(m=>m.lg&&m.round===lr).forEach(m=>(m.ev||[]).forEach(e=>{const c=e.s?m.a:m.h;
   if(e.p){const x=P[e.p]=P[e.p]||{n:e.pn,c,v:0,g:0,a:0};x.g++;x.v+=3}
   if(e.a){const x=P[e.a]=P[e.a]||{n:e.an,c,v:0,g:0,a:0};x.a++;x.v+=2}}));
 const best=Object.values(P).sort((x,y)=>y.v-x.v)[0];
 const big=all.slice().sort((x,y)=>Math.abs(y.hg-y.ag)-Math.abs(x.hg-x.ag)||(y.hg+y.ag)-(x.hg+x.ag))[0];
 const hot=all.slice().sort((x,y)=>(y.hg+y.ag)-(x.hg+x.ag))[0];
 const ml=m=>`${esc(cname(m.h))} ${m.hg}:${m.ag} ${esc(cname(m.a))}`;
 const cs=Object.entries(CS).map(([id,v])=>({n:cname(id),c:id,v})).sort((x,y)=>y.v-x.v).slice(0,5);
 return `<div class="card"><div class="chips" style="color:var(--tx)"><span style="background:var(--bg)">⚽ Матчей: ${all.length}</span><span style="background:var(--bg)">🥅 Голов: ${goals}</span><span style="background:var(--bg)">📈 В среднем: ${(goals/all.length).toFixed(2)}</span></div></div>
 ${best?`<div class="card"><b>⭐ Игрок тура (тур ${lr})</b><div class="row">${clogo(best.c)}<div class="g"><b>${esc(best.n)}</b><div class="mu">${esc(cname(best.c))} · голов ${best.g}, передач ${best.a}</div></div></div></div>`:''}
 <div class="card"><b>👟 Бомбардиры</b>${list(top(G))}</div>
 <div class="card"><b>🎯 Ассистенты</b>${list(top(A))}</div>
 <div class="card"><b>🧤 Сухие матчи</b>${list(cs)}</div>
 <div class="card"><b>📌 Рекорды</b><div class="mu" style="margin-top:6px">Крупнейшая победа: <b style="color:var(--tx)">${ml(big)}</b></div><div class="mu">Самый результативный матч: <b style="color:var(--tx)">${ml(hot)}</b></div></div>`;
}
/*ENDSTATS*/
/*AUTH*/
function vClub(){return accountCard()+vClub0()}
function accountCard(){
 if(!window.SB)return '';
 if(authUser)return `<div class="card" style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">✅</span><div style="flex:1"><b>Аккаунт подключён</b><div class="mu">${esc(authUser.email||'Google')}. Клуб сохранён и доступен с любого устройства.</div></div><button class="btn" onclick="authOut()">Выйти</button></div>`;
 return `<div class="card"><b>🔐 Для безопасности клуба лучше войти</b><div class="mu" style="margin:4px 0 10px">Вход необязателен, можно играть и так. Но без него клуб хранится только в этом браузере: очистите данные или смените телефон, и доступ к клубу пропадёт. С аккаунтом клуб остаётся за вами навсегда и открывается с любого устройства.</div><button class="btn pr" onclick="openAuth()">Войти или создать аккаунт</button></div>`;
}
const authErr=e=>/Invalid login/i.test(e.message)?'Неверная почта или пароль':/already/i.test(e.message)?'Такая почта уже зарегистрирована, нажмите «Войти»':e.message;
function openAuth(){
 const w=document.createElement('div');
 w.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99';
 w.innerHTML=`<div class="card" style="max-width:420px;width:100%;margin:0"><h3>Вход в аккаунт</h3><input id="ae" type="email" placeholder="Почта" autocomplete="email"><input id="ap" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password"><div id="am" class="mu" style="min-height:18px;margin-bottom:8px"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pr" id="ain">Войти</button><button class="btn" id="aup">Создать аккаунт</button>${CFG.google?'<button class="btn" id="agg">Войти через Google</button>':''}<button class="btn" id="acl">Закрыть</button></div></div>`;
 document.body.appendChild(w);
 const m=t=>{w.querySelector('#am').textContent=t},v=()=>[w.querySelector('#ae').value.trim(),w.querySelector('#ap').value];
 w.querySelector('#acl').onclick=()=>w.remove();
 w.querySelector('#ain').onclick=async()=>{const[e,p]=v();m('Входим…');const{error}=await SB.auth.signInWithPassword({email:e,password:p});if(error)m(authErr(error));else w.remove()};
 w.querySelector('#aup').onclick=async()=>{const[e,p]=v();if(p.length<6)return m('Пароль не короче 6 символов');m('Создаём аккаунт…');
  const{data,error}=await SB.auth.signUp({email:e,password:p});
  if(error)m(authErr(error));else if(!data.session)m('Проверьте почту и подтвердите адрес, затем нажмите «Войти».');else w.remove()};
 const g=w.querySelector('#agg');if(g)g.onclick=()=>SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});
}
async function authOut(){try{await SB.auth.signOut()}catch(e){}authUser=null;bound=false;render()}
async function bindAccount(){
 if(!authUser||bound||!clubsReady)return;bound=true;
 const f=clubs.find(c=>c.uid===authUser.id);
 if(f){if(f.id!==me){me=f.id;try{localStorage.setItem('lg_uid',me)}catch(e){}render()}return}
 const c=myClub();
 if(c&&!c.uid){try{await col('clubs').doc(me).update({uid:authUser.id})}catch(e){}}
}
async function authInit(){
 if(!window.SB)return;
 try{const{data}=await SB.auth.getSession();authUser=data.session?data.session.user:null;bindAccount()}catch(e){}
 SB.auth.onAuthStateChange((ev,ses)=>{authUser=ses?ses.user:null;bound=false;bindAccount();render()});
}
/*ENDAUTH*/
